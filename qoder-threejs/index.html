<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>雨夜便利店街角</title>
<style>
  :root { color-scheme: dark; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050b15; }
  body { cursor: grab; }
  body:active { cursor: grabbing; }
  canvas { display: block; width: 100%; height: 100%; }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background:
      radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 42%, rgba(1,5,12,.26) 78%, rgba(0,3,9,.58) 100%),
      linear-gradient(to bottom, rgba(3,8,17,.18), rgba(0,0,0,0) 22%, rgba(0,0,0,0) 80%, rgba(0,2,7,.22));
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const TAU = Math.PI * 2;
const PI = Math.PI;
const clamp = THREE.MathUtils.clamp;
const lerp = THREE.MathUtils.lerp;
const smoothstep = THREE.MathUtils.smoothstep;
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

let randomSeed = 731927;
function rnd() {
  randomSeed = (randomSeed * 1664525 + 1013904223) >>> 0;
  return randomSeed / 4294967296;
}
function rr(a, b) { return a + (b - a) * rnd(); }
function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x071222, 0.0135);
const BASE_FOV = 38;
const FRAME_ASPECT = 1.95;
const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 120);
camera.position.set(14.12, 9.82, 20.27);
camera.layers.enable(1);

function fitCameraFov() {
  const aspect = window.innerWidth / window.innerHeight;
  camera.aspect = aspect;
  const framedFov = aspect >= FRAME_ASPECT ? BASE_FOV
    : THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(BASE_FOV / 2)) * FRAME_ASPECT / aspect));
  camera.fov = Math.min(framedFov, 72);
  camera.updateProjectionMatrix();
}
fitCameraFov();

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.45, -0.8, -0.5);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.75;
controls.panSpeed = 0.7;
controls.minDistance = 11;
controls.maxDistance = 38;
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = 1.45;
controls.screenSpacePanning = true;
controls.update();

const composer = new EffectComposer(renderer);
composer.renderTarget1.samples = 4;
composer.renderTarget2.samples = 4;
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.34, 0.55, 0.8);
composer.addPass(bloomPass);
const outputPass = new OutputPass();
composer.addPass(outputPass);

const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

function makeTexture(w, h, draw, repeat = null) {
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = maxAniso;
  if (repeat) {
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(repeat[0], repeat[1]);
  }
  return tex;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function jpFont(size, weight = 700) {
  return `${weight} ${size}px "Yu Gothic UI", "Meiryo", "Hiragino Kaku Gothic ProN", sans-serif`;
}
function latinFont(size, weight = 700) {
  return `${weight} ${size}px "Trebuchet MS", "Segoe UI", sans-serif`;
}

function drawSpaced(ctx, text, x, y, spacing) {
  let cx = x;
  for (const ch of text) {
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + spacing;
  }
}

const gradientMap = (() => {
  const data = new Uint8Array([52, 52, 52, 112, 112, 112, 186, 186, 186, 255, 255, 255]);
  const t = new THREE.DataTexture(data, 4, 1, THREE.RedFormat);
  t.minFilter = THREE.NearestFilter;
  t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
})();

function toon(color, extra = {}) {
  return new THREE.MeshToonMaterial({ color, gradientMap, ...extra });
}
function std(color, extra = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.02, ...extra });
}

const OUTLINE_VERTEX = `
  uniform float uThickness;
  void main() {
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vec3 n = normalize(normalMatrix * normal);
    vec4 clip = projectionMatrix * mv;
    vec2 dir = (projectionMatrix * vec4(n, 0.0)).xy;
    dir /= max(length(dir), 0.00001);
    clip.xy += dir * uThickness * clip.w;
    gl_Position = clip;
  }
`;
const OUTLINE_FRAGMENT = `
  uniform vec3 uColor;
  uniform float uAlpha;
  void main() {
    gl_FragColor = vec4(uColor, uAlpha);
  }
`;

function outlineMaterial(thickness = 1, color = 0x07111b, alpha = 1) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uThickness: { value: 0.00225 * thickness },
      uColor: { value: new THREE.Color(color) },
      uAlpha: { value: alpha }
    },
    vertexShader: OUTLINE_VERTEX,
    fragmentShader: OUTLINE_FRAGMENT,
    side: THREE.BackSide,
    transparent: alpha < 1,
    depthWrite: true
  });
}

function addOutline(mesh, thickness = 1) {
  if (!mesh.geometry?.attributes?.normal || Array.isArray(mesh.material)) return mesh;
  if (mesh.userData.hasOutline) return mesh;
  const o = new THREE.Mesh(mesh.geometry, outlineMaterial(thickness));
  o.castShadow = false;
  o.receiveShadow = false;
  o.frustumCulled = mesh.frustumCulled;
  mesh.add(o);
  mesh.userData.hasOutline = true;
  return mesh;
}

function addBox(w, h, d, material, x, y, z, opts = {}) {
  const {
    radius = 0, seg = 2, parent = scene, rx = 0, ry = 0, rz = 0,
    cast = false, receive = false, outline = 0, name = ''
  } = opts;
  const geo = radius > 0
    ? new RoundedBoxGeometry(w, h, d, seg, Math.min(radius, w * 0.45, h * 0.45, d * 0.45))
    : new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = cast;
  m.receiveShadow = receive;
  m.name = name;
  parent.add(m);
  if (outline) addOutline(m, outline);
  return m;
}

function addCylinder(rTop, rBottom, h, radial, material, x, y, z, opts = {}) {
  const {
    parent = scene, rx = 0, ry = 0, rz = 0, cast = false, receive = false,
    outline = 0, open = false, name = ''
  } = opts;
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBottom, h, radial, 1, open), material);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = cast;
  m.receiveShadow = receive;
  m.name = name;
  parent.add(m);
  if (outline) addOutline(m, outline);
  return m;
}

function addPlane(w, h, material, x, y, z, rx = 0, ry = 0, rz = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), material);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.receiveShadow = false;
  parent.add(m);
  return m;
}

function tubeBetween(a, b, radius, material, radial = 8) {
  const dir = b.clone().sub(a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, radial), material);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}

function glowTexture() {
  return makeTexture(128, 128, (ctx, w, h) => {
    const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.15, 'rgba(255,255,255,.95)');
    g.addColorStop(0.42, 'rgba(255,255,255,.32)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  });
}
const GLOW_TEX = glowTexture();

function addGlow(color, scale, opacity, x, y, z, parent = scene, layer = 1) {
  const material = new THREE.SpriteMaterial({
    map: GLOW_TEX,
    color,
    transparent: true,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true
  });
  const sprite = new THREE.Sprite(material);
  sprite.position.set(x, y, z);
  sprite.scale.set(scale, scale, 1);
  sprite.layers.set(layer);
  parent.add(sprite);
  return sprite;
}

const shadowTexture = makeTexture(256, 256, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w / 2, h / 2, 2, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(0,0,0,.82)');
  g.addColorStop(0.5, 'rgba(0,0,0,.42)');
  g.addColorStop(0.82, 'rgba(0,0,0,.1)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
});

function contactShadow(x, z, w, d, opacity = 0.6, y = 0.212, rotation = 0) {
  const mat = new THREE.MeshBasicMaterial({
    map: shadowTexture,
    transparent: true,
    opacity,
    color: 0x000000,
    depthWrite: false
  });
  const p = addPlane(w, d, mat, x, y, z, -PI / 2, 0, rotation);
  p.renderOrder = 2;
  return p;
}

const TEX = {};

TEX.sidewalk = makeTexture(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#727b86';
  ctx.fillRect(0, 0, w, h);
  const tile = w / 4;
  for (let y = 0; y < 4; y++) {
    for (let x = 0; x < 4; x++) {
      const v = Math.sin(x * 12.9 + y * 31.7) * 6;
      ctx.fillStyle = `rgb(${113 + v}, ${121 + v}, ${132 + v})`;
      ctx.fillRect(x * tile + 4, y * tile + 4, tile - 8, tile - 8);
      ctx.strokeStyle = 'rgba(37,46,58,.42)';
      ctx.lineWidth = 3;
      ctx.strokeRect(x * tile + 2, y * tile + 2, tile - 4, tile - 4);
    }
  }
  for (let i = 0; i < 1500; i++) {
    const x = rnd() * w, y = rnd() * h;
    ctx.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,.045)' : 'rgba(15,28,41,.08)';
    ctx.fillRect(x, y, rr(1, 2.4), rr(1, 2.4));
  }
  ctx.strokeStyle = 'rgba(28,37,48,.33)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(58, 380);
  ctx.lineTo(110, 338);
  ctx.lineTo(142, 360);
  ctx.moveTo(320, 76);
  ctx.lineTo(302, 124);
  ctx.stroke();
}, [3.6, 3.6]);

TEX.floor = makeTexture(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#c8bfae';
  ctx.fillRect(0, 0, w, h);
  const tile = w / 4;
  for (let y = 0; y < 4; y++) {
    for (let x = 0; x < 4; x++) {
      const v = Math.sin(x * 8.7 + y * 17.2) * 4;
      ctx.fillStyle = `rgb(${199 + v}, ${190 + v}, ${174 + v})`;
      ctx.fillRect(x * tile + 3, y * tile + 3, tile - 6, tile - 6);
    }
  }
  ctx.strokeStyle = 'rgba(103,94,82,.28)';
  ctx.lineWidth = 2;
  for (let i = 0; i <= 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * tile, 0);
    ctx.lineTo(i * tile, h);
    ctx.moveTo(0, i * tile);
    ctx.lineTo(w, i * tile);
    ctx.stroke();
  }
  for (let i = 0; i < 700; i++) {
    ctx.fillStyle = 'rgba(90,82,70,.055)';
    ctx.fillRect(rnd() * w, rnd() * h, rr(1, 4), rr(1, 3));
  }
}, [4.2, 2.4]);

TEX.tactile = makeTexture(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#d7a833';
  ctx.fillRect(0, 0, w, h);
  for (let y = 24; y < h; y += 48) {
    for (let x = 24; x < w; x += 48) {
      ctx.fillStyle = '#e5bd52';
      ctx.beginPath();
      ctx.arc(x, y, 13, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(109,77,7,.3)';
      ctx.lineWidth = 4;
      ctx.stroke();
    }
  }
  ctx.strokeStyle = 'rgba(129,89,15,.35)';
  ctx.lineWidth = 4;
  ctx.strokeRect(1, 1, w - 2, h - 2);
}, [3, 3]);

TEX.crosswalk = makeTexture(512, 1024, (ctx, w, h) => {
  ctx.clearRect(0, 0, w, h);
  const count = 8;
  const gap = h / count;
  for (let i = 0; i < count; i++) {
    const y = i * gap + gap * 0.18;
    const bh = gap * 0.5;
    ctx.fillStyle = 'rgba(225,232,231,.94)';
    roundRect(ctx, w * 0.06, y, w * 0.88, bh, 10);
    ctx.fill();
    for (let j = 0; j < 90; j++) {
      ctx.clearRect(w * 0.06 + rnd() * w * 0.88, y + rnd() * bh, rr(1, 8), rr(1, 3));
    }
  }
});

TEX.crosswalkSide = makeTexture(1024, 512, (ctx, w, h) => {
  ctx.clearRect(0, 0, w, h);
  const count = 8;
  const gap = w / count;
  for (let i = 0; i < count; i++) {
    const x = i * gap + gap * 0.18;
    const bw = gap * 0.5;
    ctx.fillStyle = 'rgba(225,232,231,.9)';
    roundRect(ctx, x, h * 0.08, bw, h * 0.84, 10);
    ctx.fill();
    for (let j = 0; j < 80; j++) {
      ctx.clearRect(x + rnd() * bw, h * 0.08 + rnd() * h * 0.84, rr(1, 3), rr(1, 8));
    }
  }
});

TEX.paint = makeTexture(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#d9e1df';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 800; i++) {
    ctx.fillStyle = 'rgba(53,64,70,.08)';
    ctx.fillRect(rnd() * w, rnd() * h, rr(1, 8), rr(1, 4));
  }
});

TEX.manhole = makeTexture(512, 512, (ctx, w, h) => {
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  ctx.fillStyle = '#3b4650';
  ctx.beginPath(); ctx.arc(cx, cy, 244, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#707c84'; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.arc(cx, cy, 232, 0, TAU); ctx.stroke();
  ctx.lineWidth = 5;
  for (let r = 54; r <= 205; r += 37) {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
  }
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * TAU;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * 58, cy + Math.sin(a) * 58);
    ctx.lineTo(cx + Math.cos(a) * 220, cy + Math.sin(a) * 220);
    ctx.stroke();
  }
  ctx.fillStyle = '#929ba0';
  ctx.font = latinFont(54, 800);
  ctx.textAlign = 'center';
  ctx.fillText('星野市', cx, cy + 18);
  ctx.font = latinFont(20, 700);
  ctx.fillText('HOSHINO CITY', cx, cy + 54);
});

TEX.posterCoffee = makeTexture(512, 768, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#e9b35d');
  g.addColorStop(1, '#d77e43');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#fff3d6';
  ctx.beginPath(); ctx.arc(w / 2, h * 0.42, 175, 0, TAU); ctx.fill();
  ctx.fillStyle = '#4a2d21';
  roundRect(ctx, 170, 315, 175, 150, 28); ctx.fill();
  ctx.fillStyle = '#6c3c27';
  ctx.beginPath(); ctx.arc(345, 370, 55, -PI / 2, PI / 2); ctx.lineWidth = 26; ctx.strokeStyle = '#5b3525'; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,246,222,.72)'; ctx.lineWidth = 12; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(205 + i * 45, 280);
    ctx.bezierCurveTo(180 + i * 45, 240, 235 + i * 45, 225, 208 + i * 45, 190);
    ctx.stroke();
  }
  ctx.fillStyle = '#3c2822'; ctx.textAlign = 'center';
  ctx.font = latinFont(78, 900); ctx.fillText('HOT', w / 2, 585);
  ctx.font = latinFont(66, 900); ctx.fillText('COFFEE', w / 2, 652);
  ctx.font = jpFont(38, 800); ctx.fillText('あったか〜い', w / 2, 718);
});

TEX.posterFood = makeTexture(512, 768, (ctx, w, h) => {
  ctx.fillStyle = '#e9dfc6'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#1c6662'; ctx.fillRect(0, 0, w, 40); ctx.fillRect(0, h - 40, w, 40);
  ctx.fillStyle = '#f4a23e';
  ctx.beginPath(); ctx.arc(w / 2, 300, 205, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff1ce';
  ctx.beginPath(); ctx.arc(w / 2, 300, 155, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c17837';
  for (let i = 0; i < 5; i++) {
    const a = -1.1 + i * 0.55;
    ctx.save();
    ctx.translate(w / 2 + Math.cos(a) * 50, 305 + Math.sin(a) * 35);
    ctx.rotate(a);
    ctx.beginPath(); ctx.ellipse(0, 0, 62, 30, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#224844'; ctx.textAlign = 'center';
  ctx.font = jpFont(76, 900); ctx.fillText('できたて', w / 2, 580);
  ctx.font = jpFont(102, 900); ctx.fillText('ホット', w / 2, 680);
});

TEX.windowDecal = makeTexture(256, 256, (ctx, w, h) => {
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#3fddd4'; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.arc(w / 2, h / 2, 104, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#173f40'; ctx.textAlign = 'center';
  ctx.font = latinFont(70, 900); ctx.fillText('OPEN', w / 2, 127);
  ctx.font = latinFont(60, 900); ctx.fillText('24H', w / 2, 190);
  ctx.fillStyle = '#f5bd5a';
  ctx.beginPath(); ctx.arc(211, 54, 18, 0, TAU); ctx.fill();
});

TEX.sign = makeTexture(2048, 256, (ctx, w, h) => {
  ctx.fillStyle = '#f4eedc'; ctx.fillRect(0, 0, w, h);
  const sheen = ctx.createLinearGradient(0, 0, w, h);
  sheen.addColorStop(0, 'rgba(255,255,255,.3)');
  sheen.addColorStop(0.55, 'rgba(255,255,255,0)');
  sheen.addColorStop(1, 'rgba(158,194,187,.14)');
  ctx.fillStyle = sheen; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#1b605d'; ctx.fillRect(0, 0, w, 13); ctx.fillRect(0, h - 13, w, 13);
  for (let x = 0; x < w; x += 26) {
    ctx.fillStyle = 'rgba(26,95,91,.035)';
    ctx.fillRect(x, 15, 2, h - 30);
  }
  ctx.fillStyle = '#1d6864';
  ctx.beginPath(); ctx.arc(133, 126, 73, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f4eedc';
  ctx.beginPath(); ctx.arc(161, 104, 64, 0, TAU); ctx.fill();
  ctx.fillStyle = '#efa348';
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? 24 : 10;
    const a = -PI / 2 + i * PI / 5;
    const px = 219 + Math.cos(a) * r;
    const py = 95 + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.textAlign = 'left';
  ctx.fillStyle = '#163b3f';
  ctx.font = jpFont(136, 900);
  ctx.fillText('ほしぞらマート', 326, 155);
  ctx.fillStyle = '#4b726e';
  ctx.font = latinFont(32, 800);
  drawSpaced(ctx, 'HOSHIZORA MART', 332, 207, 6.5);
  ctx.fillStyle = '#1d6864';

function buildEnvironment() {
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x030711);
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(30, 24, 16),
    new THREE.MeshBasicMaterial({ color: 0x071424, side: THREE.BackSide })
  );
  envScene.add(sphere);
  const panel = (w, h, color, intensity, pos, lookAt) => {
    const c = new THREE.Color(color).multiplyScalar(intensity);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
    m.position.copy(pos);
    m.lookAt(lookAt);
    envScene.add(m);
  };
  panel(11, 4.2, 0xffc37a, 3.2, V3(0, 2.2, 10), V3(0, 2, 0));
  panel(5, 2.5, 0x63d8d0, 1.6, V3(-9, 3, 4), V3(0, 1.5, 0));
  panel(6, 1.0, 0xffeac8, 2.6, V3(1, 6.5, 1), V3(0, 0, 0));
  panel(8, 4, 0x234f82, 0.85, V3(10, 4, -4), V3(0, 2, 0));
  panel(7, 2, 0xffffff, 1.0, V3(-2, 7, -8), V3(0, 0, 0));
  const pmrem = new THREE.PMREMGenerator(renderer);
  const rt = pmrem.fromScene(envScene, 0.035);
  scene.environment = rt.texture;
  pmrem.dispose();
  envScene.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });
}

const reflectionShader = {
  name: 'WetRoadShader',
  uniforms: {
    color: { value: null },
    tDiffuse: { value: null },
    textureMatrix: { value: null },
    uTime: { value: 0 }
  },
  vertexShader: `
    uniform mat4 textureMatrix;
    varying vec4 vReflUv;
    varying vec2 vLocalUv;
    void main() {
      vLocalUv = uv;
      vReflUv = textureMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    varying vec4 vReflUv;
    varying vec2 vLocalUv;

    float hash21(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float noise2(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash21(i);
      float b = hash21(i + vec2(1.0, 0.0));
      float c = hash21(i + vec2(0.0, 1.0));
      float d = hash21(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }
    float fbm(vec2 p) {
      float v = 0.0;
      v += noise2(p) * 0.52;
      v += noise2(p * 2.03 + 7.0) * 0.27;
      v += noise2(p * 4.07 + 17.0) * 0.14;
      v += noise2(p * 8.16 + 31.0) * 0.07;
      return v;
    }

    void main() {
      vec2 p = vLocalUv * 17.0;
      vec2 q = vReflUv.xy / vReflUv.w;

      float broad = fbm(p * 0.38 + vec2(4.2, 8.7));
      float puddle = smoothstep(0.46, 0.66, broad);
      float micro = noise2(p * 20.0);
      float wash = smoothstep(0.38, 0.78, fbm(p * vec2(0.22, 1.8) + 13.0));

      vec2 warp = (vec2(
        fbm(p * 0.65 + vec2(uTime * 0.035, 0.0)),
        fbm(p * 0.65 + vec2(9.2, 3.7 - uTime * 0.028))
      ) - 0.5) * 0.006;

      vec2 cell = p * 1.75;
      vec2 id = floor(cell);
      vec2 f = fract(cell) - 0.5;
      float phase = hash21(id);
      float radius = fract(uTime * 0.52 + phase);
      vec2 center = (vec2(hash21(id + 2.7), hash21(id + 7.1)) - 0.5) * 0.45;
      float d = length(f - center);
      float ring = smoothstep(0.045, 0.0, abs(d - radius * 0.42)) * (1.0 - radius);
      warp += normalize(f - center + vec2(0.001)) * ring * 0.012;

      vec2 ruv = q + warp * mix(0.5, 1.5, puddle);
      vec3 refl = vec3(0.0);
      refl += texture2D(tDiffuse, ruv).rgb * 0.34;
      refl += texture2D(tDiffuse, ruv + vec2(0.0018, 0.0004)).rgb * 0.165;
      refl += texture2D(tDiffuse, ruv - vec2(0.0018, 0.0004)).rgb * 0.165;
      refl += texture2D(tDiffuse, ruv + vec2(0.0003, 0.0023)).rgb * 0.165;
      refl += texture2D(tDiffuse, ruv - vec2(0.0003, 0.0023)).rgb * 0.165;
      refl *= vec3(0.72, 0.84, 1.06);

      vec3 asphalt = mix(vec3(0.017, 0.026, 0.040), vec3(0.041, 0.052, 0.062), micro * 0.55 + broad * 0.28);
      asphalt += vec3(0.012, 0.018, 0.022) * wash;
      float amount = clamp(0.23 + puddle * 0.47 + wash * 0.16, 0.0, 0.82);
      vec3 col = mix(asphalt, refl, amount);
      col += vec3(0.31, 0.41, 0.49) * ring * (0.06 + puddle * 0.18);

function makePuddle(x, z, radiusX, radiusZ, y = 0.215, rotation = 0) {
  const shape = new THREE.Shape();
  const n = 18;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    const w = 1 + Math.sin(a * 3 + x) * 0.1 + Math.sin(a * 5 + z * 2) * 0.055;
    const px = Math.cos(a) * radiusX * w;
    const py = Math.sin(a) * radiusZ * w;
    if (i === 0) shape.moveTo(px, py); else shape.lineTo(px, py);
  }
  shape.closePath();
  const material = new THREE.MeshPhysicalMaterial({
    color: 0x0a1b28,
    roughness: 0.055,
    metalness: 0.25,
    clearcoat: 1,
    clearcoatRoughness: 0.03,
    transparent: true,
    opacity: 0.68,
    envMapIntensity: 1.8,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape, 24), material);
  mesh.rotation.x = -PI / 2;
  mesh.rotation.z = rotation;
  mesh.position.set(x, y, z);
  mesh.renderOrder = 1;
  scene.add(mesh);
  return mesh;
}

function registerPack(x, y, z, w, h, d, color, ry = 0, withLabel = true) {
  packages.push({ x, y, z, w, h, d, color, ry });

function buildShelf(cx, cz, w, d, h, levels) {
  addBox(w, 0.16, d, MAT.tealDark, cx, 0.46, cz, {
    radius: 0.025, seg: 2, parent: storeGroup, cast: true, receive: true, outline: 0.55
  });
  addBox(w, h - 0.2, 0.055, toon(0x23615c), cx, 0.46 + h / 2, cz - d / 2 + 0.04, {
    radius: 0.015, seg: 1, parent: storeGroup, receive: true
  });
  for (const sx of [-w / 2, w / 2]) {
    addBox(0.06, h, d, MAT.teal, cx + sx, 0.46 + h / 2, cz, {
      radius: 0.015, seg: 1, parent: storeGroup, cast: true
    });
  }
  const shelfY = [];
  for (let i = 0; i < levels; i++) {
    const y = 0.6 + i * ((h - 0.24) / Math.max(1, levels - 1));
    shelfY.push(y);
    addBox(w + 0.03, 0.045, d + 0.035, MAT.creamDim, cx, y, cz, {
      radius: 0.014, seg: 1, parent: storeGroup, receive: true
    });
    addBox(w + 0.04, 0.065, 0.03, MAT.teal, cx, y - 0.025, cz + d / 2 + 0.025, {
      radius: 0.01, seg: 1, parent: storeGroup
    });
    const count = Math.floor(w / 0.185);
    for (let j = 0; j < count; j++) {
      if (rnd() < 0.12) continue;
      const pw = rr(0.11, 0.165);
      const ph = rr(0.16, 0.23);
      const px = cx - w / 2 + 0.12 + j * ((w - 0.24) / Math.max(1, count - 1) || 0) + rr(-0.015, 0.015);
      registerPack(px, y + 0.0225 + ph / 2, cz + rr(-0.025, 0.03), pw, ph, rr(0.055, 0.07), pick(productPalette), rr(-0.04, 0.04), rnd() > 0.18);
      if (j % 3 === 0) {
        addBox(0.06, 0.055, 0.006, MAT.porcelain, px, y - 0.015, cz + d / 2 + 0.043, {
          radius: 0.006, seg: 1, parent: storeGroup
        });
      }
    }
    if (i === levels - 1) {
      for (let j = 0; j < 4; j++) {
        const px = cx - w * 0.35 + j * w * 0.23;
        const ph = rr(0.22, 0.27);
        registerPack(px, y + 0.0225 + ph / 2, cz - 0.02, 0.14, ph, 0.06, pick([0xd8ccb3, 0xb85848, 0x5f8b66, 0xd6a44b]), rr(-0.03, 0.03), true);
      }
    }
  }
}

  let i = 0;
  while (i < count) {
    const x = rr(-8.35, 8.35);
    const z = rr(-8.35, 8.35);
    if (x > -4.8 && x < 4.4 && z > -6.35 && z < -0.75) continue;
    positions[i * 3] = x;
    positions[i * 3 + 1] = rr(0, 11);
    positions[i * 3 + 2] = z;
    speeds[i] = rr(7.0, 11.8);
    sizes[i] = rr(sizeMin, sizeMax);

  g.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  g.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
  g.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));

    uniforms: THREE.UniformsUtils.clone(rainUniforms),

}
const rainMain = createRain(4200, 0.55, 1.15, 0.4);
const rainNear = createRain(900, 1.2, 2.3, 0.56);

const rippleCount = 72;
const rippleData = [];
function ripplePosition() {
  const mode = rnd();
  if (mode < 0.55) {
    return { x: rr(-8.25, 4.92), z: rr(1.85, 8.25), y: 0.076 };
  } else if (mode < 0.75) {
    return { x: rr(5.6, 8.25), z: rr(-8.25, 1.2), y: 0.076 };
  } else if (mode < 0.94) {
    return { x: rr(-8.25, 4.9), z: rr(-0.68, 1.35), y: 0.216 };
  }
  return { x: rr(4.28, 5.14), z: rr(-7.8, -0.9), y: 0.216 };
}
for (let i = 0; i < rippleCount; i++) {
  rippleData.push({
    ...ripplePosition(),
    phase: rnd(),
    life: rr(0.65, 1.35),
    maxScale: rr(0.24, 0.62),
    tint: new THREE.Color().setRGB(rr(0.55, 0.95), rr(0.7, 1.0), 1.0)
  });
}
const rippleGeo = new THREE.PlaneGeometry(1, 1);
const rippleMat = new THREE.MeshBasicMaterial({
  map: TEX.ring,
  transparent: true,
  opacity: 0.9,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide
});
const ripples = new THREE.InstancedMesh(rippleGeo, rippleMat, rippleCount);
ripples.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
ripples.frustumCulled = false;
ripples.renderOrder = 4;
const rippleQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(-PI / 2, 0, 0));
const rippleMatrix = new THREE.Matrix4();
const rippleColor = new THREE.Color();
for (let i = 0; i < rippleCount; i++) {
  ripples.setColorAt(i, rippleColor.setRGB(0, 0, 0));
}
ripples.instanceColor.needsUpdate = true;
scene.add(ripples);

const dripCount = 26;
const dripData = [];
for (let i = 0; i < dripCount; i++) {
  dripData.push({
    x: rr(-4.12, 3.95),
    z: rr(-0.08, 0.04),
    phase: rnd(),
    speed: rr(0.12, 0.19),
    pause: rr(0.15, 0.48)
  });
}
const dripMesh = new THREE.InstancedMesh(
  new THREE.CapsuleGeometry(0.014, 0.085, 2, 5),
  new THREE.MeshBasicMaterial({
    color: 0xd7f2ff,
    transparent: true,
    opacity: 0.66,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  }),
  dripCount
);
dripMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
dripMesh.frustumCulled = false;
scene.add(dripMesh);

const dripSplashes = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(0.24, 0.24),
  new THREE.MeshBasicMaterial({
    map: TEX.ring,
    transparent: true,
    opacity: 0.7,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide
  }),
  10
);
dripSplashes.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
dripSplashes.frustumCulled = false;
scene.add(dripSplashes);

const steamSprites = [];
function makeSteam(source) {
  for (let i = 0; i < source.count; i++) {
    const mat = new THREE.SpriteMaterial({
      map: GLOW_TEX,
      color: source.color,
      transparent: true,
      opacity: 0,
      depthWrite: false,
      blending: THREE.NormalBlending
    });
    const sprite = new THREE.Sprite(mat);
    sprite.position.set(source.x + rr(-source.spread, source.spread), source.y + rr(0, 0.3), source.z + rr(-0.12, 0.12));
    sprite.scale.set(0.3, 0.3, 1);
    sprite.layers.set(1);
    scene.add(sprite);
    steamSprites.push({
      sprite,
      baseX: source.x + rr(-source.spread * 0.65, source.spread * 0.65),
      baseZ: source.z + rr(-0.1, 0.16),
      baseY: source.y + rr(0, 0.12),
      phase: rnd(),
      speed: rr(0.13, 0.26),
      drift: rr(-0.1, 0.1)
    });
  }
}
steamSources.forEach(makeSteam);

const dripDummy = new THREE.Object3D();
const splashDummy = new THREE.Object3D();
let doorOpen = 0;

function updateDoors(time) {
  const cycle = 15.5;
  const p = (time + 3.1) % cycle;
  const opening = p > 3.2 && p < 9.0 ? 1 : 0;
  const eased = doorOpen + (opening - doorOpen) * 0.035;
  doorOpen = eased;
  const slide = 1.12 * smoothstep(eased, 0, 1);
  for (const leaf of doorLeaves) {
    leaf.group.position.x = leaf.baseX + leaf.side * slide;
  }
  const pulse = 0.72 + 0.28 * Math.sin(time * 4.1);
  doorSensorGlow.material.opacity = 0.12 + 0.25 * (opening ? 1 : pulse * 0.4);
  doorSensorGlow.material.color.setRGB(1.0, 0.16 + pulse * 0.12, 0.06);
  interiorSpill.intensity = 34 + doorOpen * 8;
}
function updateSign(time) {
  const flicker = 0.965 + Math.sin(time * 4.7) * 0.018 + Math.sin(time * 17.3) * 0.007
    + (Math.sin(time * 2.11 + 1.4) > 0.995 ? -0.035 : 0);
  signFaceMat.color.setRGB(0.78 * flicker, 0.78 * flicker, 0.73 * flicker);
  signGlow.material.opacity = 0.045 + 0.02 * flicker;
  signFill.intensity = 5.2 + flicker * 0.9;
}
function updateRipples(time) {
  for (let i = 0; i < rippleCount; i++) {
    const d = rippleData[i];
    const age = ((time + d.phase * 10.0) % d.life) / d.life;
    const s = 0.12 + age * d.maxScale;
    const fade = Math.pow(1 - age, 1.8) * (age < 0.06 ? age / 0.06 : 1);
    rippleMatrix.compose(
      new THREE.Vector3(d.x, d.y, d.z),
      rippleQuat,
      new THREE.Vector3(s, s, s)
    );
    ripples.setMatrixAt(i, rippleMatrix);
    rippleColor.copy(d.tint).multiplyScalar(fade * 0.8);
    ripples.setColorAt(i, rippleColor);
  }
  ripples.instanceMatrix.needsUpdate = true;
  ripples.instanceColor.needsUpdate = true;
}
function updateDrips(time) {
  let splashIndex = 0;
  for (let i = 0; i < dripCount; i++) {
    const d = dripData[i];
    const p = (time * d.speed + d.phase) % 1;
    if (p < d.pause) {
      dripDummy.position.set(d.x, 2.78, d.z);
      dripDummy.scale.set(0, 0, 0);
    } else {
      const f = (p - d.pause) / (1 - d.pause);
      const y = lerp(2.78, 0.22, f * f);
      dripDummy.position.set(d.x, y, d.z);
      dripDummy.scale.set(1, 0.7 + f * 0.9, 1);
      if (splashIndex < 10 && f > 0.965) {
        const sp = (p - 0.965) / 0.035;
        const s = 0.24 + sp * 0.8;
        splashDummy.position.set(d.x, 0.217, d.z);
        splashDummy.rotation.set(-PI / 2, 0, 0);
        splashDummy.scale.set(s, s, 1);
        splashDummy.updateMatrix();
        dripSplashes.setMatrixAt(splashIndex, splashDummy.matrix);
        splashIndex++;
      }
    }
    dripDummy.updateMatrix();
    dripMesh.setMatrixAt(i, dripDummy.matrix);
  }
  for (let i = splashIndex; i < 10; i++) {
    splashDummy.position.set(0, -2, 0);
    splashDummy.scale.set(0, 0, 0);
    splashDummy.updateMatrix();
    dripSplashes.setMatrixAt(i, splashDummy.matrix);
  }
  dripMesh.instanceMatrix.needsUpdate = true;
  dripSplashes.instanceMatrix.needsUpdate = true;
}
function updateSteam(time) {
  for (const s of steamSprites) {
    const p = (time * s.speed + s.phase) % 1;
    s.sprite.position.set(
      s.baseX + Math.sin(p * 5.2 + s.phase * 9) * 0.12 + p * s.drift,
      s.baseY + p * 0.82,
      s.baseZ + Math.cos(p * 4.3 + s.phase * 5) * 0.075
    );
    const scale = 0.2 + p * 0.66;
    s.sprite.scale.set(scale, scale, 1);
    s.sprite.material.opacity = Math.sin(p * PI) * 0.16 * (1 - p * 0.35);
  }
}
function updateRain(time) {
  rainMain.material.uniforms.uTime.value = time;
  rainNear.material.uniforms.uTime.value = time;
  for (const a of roofACs) a.rotation.z = time * 5.4;
}

const clock = new THREE.Clock();
function animate() {
  const time = clock.getElapsedTime();
  roadReflector.material.uniforms.uTime.value = time;
  updateDoors(time);
  updateSign(time);
  updateRipples(time);
  updateDrips(time);
  updateSteam(time);
  updateRain(time);
  controls.update();
  composer.render();
}
renderer.setAnimationLoop(animate);

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  fitCameraFov();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloomPass.setSize(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
}
window.addEventListener('resize', onResize);
</script>
</body>
